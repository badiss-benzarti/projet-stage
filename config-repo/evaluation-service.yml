server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/evaluation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# --- Grille d'evaluation : poids en pourcentage, total = 100 ---
app:
  evaluation:
    weights:
      technical: 30
      quality: 20
      autonomy: 20
      communication: 15
      punctuality: 15
    scale: 20          # chaque critere note sur 20
    rounding: 0.25     # arrondi de la note finale
    # Volume horaire quotidien attendu, moyenne lissee sur la semaine.
    # Sert a calculer le retard sur les heures pour la prediction de risque.
    expected-hours-per-day: 5.0
  ml:
    url: http://${ML_HOST:localhost}:8087
