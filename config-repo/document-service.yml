server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/document_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# --- Stockage des fichiers deposes ---
app:
  storage:
    location: ${STORAGE_PATH:./storage}
    allowed-types: application/pdf,image/png,image/jpeg
