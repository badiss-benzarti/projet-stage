server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/document_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  # Stockage des fichiers deposes. Volume Docker en production.
  storage:
    location: ${STORAGE_PATH:./storage}
    allowed-types: application/pdf,image/png,image/jpeg

  # Attestation en ligne. Le cahier des charges la reserve aux stages
  # effectues a la DSI et chez EspritTech : les structures internes,
  # dont l'ecole peut attester elle-meme. Pour un stage externe,
  # l'attestation vient de l'entreprise et doit etre deposee.
  attestation:
    structures-internes: DSI,EspritTech
    etablissement: ESPRIT
    lieu: Tunis

  # Lettre d'affectation, editee par le service des stages.
  # Le contrat d'assurance est propre a l'ecole : laisse vide, la
  # mention correspondante disparait de la lettre.
  lettre:
    etablissement: esprit
    lieu: Tunis
    direction: Direction des Stages
    assureur: ${ASSUREUR:GAT Assurances}
    contrat-assurance: ${CONTRAT_ASSURANCE:}
