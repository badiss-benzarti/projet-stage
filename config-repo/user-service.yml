server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  # Photos de profil des etudiants. Volume Docker en production.
  photos:
    location: ${PHOTOS_PATH:./photos}
    allowed-types: image/jpeg,image/png,image/webp
    max-size-bytes: 2097152
