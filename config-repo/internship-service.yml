server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/internship_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# --- RabbitMQ : ce service PUBLIE les evenements du workflow ---
app:
  rabbit:
    exchange: stages.events
    routing-keys:
      submitted: stage.submitted
      approved: stage.approved
      rejected: stage.rejected
      company-accepted: stage.company.accepted
