server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# --- RabbitMQ : ce service CONSOMME les evenements ---
app:
  rabbit:
    exchange: stages.events
    queue: notifications.queue
    binding-key: "stage.#"
