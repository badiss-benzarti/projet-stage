# =====================================================================
#  nginx - sert le bundle Angular et relaie /api vers le gateway.
#
#  En developpement, proxy.conf.json fait ce travail pour "ng serve".
#  En conteneur, c'est ce fichier : meme origine pour le navigateur,
#  donc aucun probleme de CORS.
# =====================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Les televersements passent par le gateway : aligne sur
    # spring.servlet.multipart.max-request-size (15 Mo).
    client_max_body_size 15m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ---- API : tout /api part vers le gateway ----
    # ^~ : coupe court a l'evaluation des blocs "location ~*" ci-dessous,
    # sinon un telechargement dont l'URL finit par .pdf ou .png serait
    # servi comme un fichier statique et renverrait 404.
    location ^~ /api/ {
        proxy_pass         http://api-gateway:8090;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Les exports XLSX / PDF et la mise en chauffe des services
        # peuvent depasser les 60 s par defaut.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        # Le journal PDF est stream : pas de mise en tampon.
        proxy_buffering off;
    }

    # ---- Fichiers statiques versionnes par outputHashing ----
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA : toute autre route est rendue par le routeur Angular ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
