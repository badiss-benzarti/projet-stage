server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # Le registre ne s'enregistre pas aupres de lui-meme.
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  server:
    # En dev : radier rapidement les services arretes, sinon le dashboard
    # garde des instances fantomes pendant plusieurs minutes.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        # prometheus en plus : Eureka est le seul service a ne pas lire
        # le config-server - il ne peut pas s'y enregistrer avant
        # d'exister - donc sa configuration ne vient pas de
        # config-repo/application.yml comme celle des autres.
        include: health,info,prometheus
  metrics:
    tags:
      application: discovery-server
  endpoint:
    health:
      show-details: always
