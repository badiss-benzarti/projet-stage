server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # Le registre ne s'enregistre pas aupres de lui-meme.
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  server:
    # En dev : radier rapidement les services arretes, sinon le dashboard
    # garde des instances fantomes pendant plusieurs minutes.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
