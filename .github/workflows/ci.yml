# =====================================================================
#  Integration continue.
#
#  Chaque microservice est un projet autonome : pas de POM parent, pas
#  de bibliotheque partagee. La matrice reproduit ce choix - un job par
#  service, qui echoue seul sans emporter les autres, et dit lequel a
#  casse sans avoir a lire un journal de mille lignes.
# =====================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # Permet de relancer la chaine a la main depuis l'onglet Actions.
  workflow_dispatch:

# Une nouvelle poussee annule la precedente sur la meme branche :
# inutile de payer un build pour un commit deja remplace.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------
  #  Les neuf services Spring
  # ------------------------------------------------------------------
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # On veut connaitre TOUS les services casses, pas seulement le
      # premier : sans cela, corriger l'un revele l'autre au tour suivant.
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - user-service
          - internship-service
          - evaluation-service
          - document-service
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Cache par service : leurs dependances different, et le
          # fichier de verrou est le pom.xml de chacun.
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # verify declenche aussi le rapport JaCoCo, lie a cette phase.
      - name: Tests et paquetage
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B verify

      # Couverture lisible sans telecharger d'artefact : le chiffre
      # s'affiche sur la page du run.
      - name: Couverture
        if: always()
        working-directory: ${{ matrix.service }}
        run: |
          rapport=target/site/jacoco/jacoco.xml
          if [ ! -f "$rapport" ]; then
            echo "Pas de rapport JaCoCo." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # jacoco.xml tient sur une seule ligne : on extrait les balises
          # avec grep -o plutot que de compter sur un decoupage en lignes.
          # Le dernier compteur du document porte le total du module.
          lu=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"' "$rapport" | tail -1)
          manquantes=$(echo "$lu" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
          couvertes=$(echo "$lu" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
          total=$((manquantes + couvertes))
          pct=0
          [ "$total" -gt 0 ] && pct=$((couvertes * 100 / total))
          echo "**${{ matrix.service }}** — lignes couvertes : ${pct}% (${couvertes}/${total})" \
            >> "$GITHUB_STEP_SUMMARY"

      # Conserve les rapports meme quand le build echoue : c'est
      # justement la qu'ils servent.
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  #  Frontend Angular
  # ------------------------------------------------------------------
  frontend:
    name: stage-platform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          # Node 24 comme la machine de developpement : package-lock.json
          # a ete genere par npm 11.
          node-version: '24'
          cache: npm
          cache-dependency-path: stage-platform/package-lock.json

      # "npm install" et non "npm ci" : @tailwindcss/oxide-wasm32-wasi
      # tire @napi-rs/wasm-runtime, qui exige @emnapi/core et
      # @emnapi/runtime. npm sous Windows ne les juge pas installables et
      # ne les inscrit jamais dans le verrou ; sous Linux "npm ci" les
      # reclame et echoue. A remettre en "npm ci" le jour ou le verrou
      # sera regenere sous Linux.
      - name: Dependances
        working-directory: stage-platform
        run: npm install --no-audit --no-fund

      # La compilation de production est le vrai garde-fou : elle passe
      # le compilateur Angular sur les gabarits et refuse une erreur de
      # typage comme un composant manquant. Il n'y a pas encore de tests
      # unitaires cote frontend.
      - name: Compilation de production
        working-directory: stage-platform
        run: npx ng build --configuration production

  # ------------------------------------------------------------------
  #  Service de prediction
  # ------------------------------------------------------------------
  ml:
    name: ml-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Dependances
        working-directory: ml-service
        run: pip install -r requirements.txt

      # Le modele est entraine pendant la construction de l'image : le
      # verifier ici evite de decouvrir un dataset casse au moment du
      # docker build.
      - name: Entrainement du modele
        working-directory: ml-service
        run: python -m app.train

  # ------------------------------------------------------------------
  #  Recapitulatif : un seul contexte a exiger sur la branche protegee
  # ------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml]
    if: always()
    steps:
      - name: Verdict
        run: |
          echo "backend  : ${{ needs.backend.result }}"
          echo "frontend : ${{ needs.frontend.result }}"
          echo "ml       : ${{ needs.ml.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
          || [ "${{ needs.frontend.result }}" != "success" ] \
          || [ "${{ needs.ml.result }}" != "success" ]; then
            echo "::error::Au moins un module a echoue."
            exit 1
          fi
