# =====================================================================
#  Configuration de BOOTSTRAP.
#  Port, datasource et secret JWT viennent du config-server
#  (config-repo/user-service.yml + config-repo/application.yml).
# =====================================================================

spring:
  application:
    name: user-service

  config:
    import: optional:configserver:http://${CONFIG_HOST:localhost}:8888

  cloud:
    config:
      retry:
        max-attempts: 6
        initial-interval: 2000
        max-interval: 10000
