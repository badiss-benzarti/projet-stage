server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    # native = lecture depuis le systeme de fichiers (pas de depot Git distant)
    active: native

  cloud:
    config:
      server:
        native:
          # Chemin relatif au repertoire de travail du service.
          # En local  : gestion-stages/config-server -> ../config-repo
          # En Docker : volume monte sur /config-repo (variable CONFIG_REPO)
          search-locations: file:${CONFIG_REPO:../config-repo}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: always
